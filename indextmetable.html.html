<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동기안앱 - 물품·수당·업무추진비·수업교체</title>
<style>
:root{--ink:#1f2933;--mute:#6b7280;--line:#d9dde3;--bg:#f2f3f5;--blue:#2f6fe4;--hl:#fff3b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.tabs{display:flex;gap:6px}
.tabs button{padding:8px 16px;border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.title-in{font-size:16px;font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}
h2{font-size:14px;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.sym{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sym button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:16px;cursor:pointer}
.sym button.on{background:var(--acl);border-color:var(--blue);color:var(--blue)}
.sym input{width:60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar button{padding:8px 14px;border:1px solid var(--ink);background:#fff;border-radius:6px;font:inherit;cursor:pointer}
.bar button.p{background:var(--ink);color:#fff}
.bar button.d{border-color:var(--blue);color:var(--blue)}
.bar button.d:hover{background:var(--blue);color:#fff}
.paper{background:#fff;border:1px solid var(--line);padding:40px 44px;min-height:520px;font:15px/1.9 "HCR Batang","Batang","바탕",serif}
.paper h3{color:var(--blue);font-size:22px;margin:0 0 14px}
.ln{white-space:pre-wrap;word-break:keep-all;min-height:1.9em;outline:none;border-radius:3px}
.ln:focus{background:#f7f9fc}
.ln.edited{box-shadow:-4px 0 0 #7aa7ff}
.ph{background:var(--hl);border-radius:2px}
.note{font-size:12px;color:var(--mute);margin-top:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media print{header,.panel,.bar,.note{display:none}main{display:block;padding:0}.paper{border:0;padding:0}}

:root{--acl:#e8f0fe;--sel:#ffd45e;--ok:#2d7a4f;--okl:#e1f3e8}
main.wide{grid-template-columns:1fr;max-width:1400px}
main.wide>section:last-child{width:100%;max-width:900px;justify-self:center}
#sw .swh{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-bottom:12px}
#sw .swh label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:14px}
#sw .swh input,#sw .swh select{width:auto}
#sw select{border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;background:#fff}
#sw .wk{color:var(--mute);font-size:13px}
#sw .g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:14px}
@media(max-width:1000px){#sw .g2{grid-template-columns:1fr}}
#sw .box{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;min-width:0}
#sw .side{display:grid;gap:14px;align-content:start}
#sw h4{font-size:14px;margin:0 0 8px}
#sw button{padding:6px 12px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:6px;font:inherit;cursor:pointer}
#sw button.g,#sw .stabs button{background:#fff;color:var(--blue)}
#sw .stabs{display:flex;gap:6px;margin-bottom:8px}
#sw .stabs button.on{background:var(--blue);color:#fff}
#sw td:focus-visible{outline:3px solid var(--sel);outline-offset:-2px}
#sw table.tt{border-collapse:collapse;width:100%;table-layout:fixed}
#sw .tt th,#sw .tt td{border:1px solid var(--line);text-align:center;padding:4px 2px;font-size:13px;height:46px}
#sw .tt th{background:#f4f6f9;height:30px}
#sw .tt td.l{cursor:pointer}#sw .tt td.l:hover{background:var(--acl)}
#sw .tt td.b{background:#f0f0f0;color:#888}
#sw .tt td.e{background:#fafafa;color:#aaa}
#sw .tt td.s{background:var(--sel)!important;font-weight:700}
#sw .tt small{display:block;color:var(--mute);font-size:11px}
#sw .all{overflow:auto;max-height:70vh;border:1px solid var(--line)}
#sw .all table{border-collapse:separate;border-spacing:0;font-size:11px;min-width:1500px}
#sw .all th,#sw .all td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:1px 2px;text-align:center;white-space:nowrap;height:24px}
#sw .all thead th{position:sticky;top:0;background:#f4f6f9;z-index:2}
#sw .all th.nm{position:sticky;left:0;background:#f4f6f9;z-index:3;min-width:64px}
#sw .all td.l{cursor:pointer}#sw .all td.l:hover{background:var(--acl)}#sw .all td.s{background:var(--sel)}
#sw .all td.b{background:#f0f0f0;color:#888}
#sw .all td.dv,#sw .all th.dv{border-left:2px solid #8da0b3}
#sw .cand{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#sw .cand li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
#sw .cand li.on{border-color:var(--ok);background:var(--okl)}
#sw .tag{font-size:11px;border-radius:10px;padding:1px 7px;background:var(--acl);color:var(--blue);margin-left:4px}
#sw .cur{background:#fff8dc;border:1px solid #e8d48a;border-radius:8px;padding:8px 10px;margin-bottom:10px}
#sw .pk{width:100%;border-collapse:collapse;font-size:13px}#sw .pk td,#sw .pk th{border-bottom:1px solid var(--line);padding:4px;text-align:left}
#sw .pk input{width:90px;padding:4px 6px}
.p2{font:13px/1.4 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;min-height:0}
.p2 table.cg{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
.p2 .cg td{border:1px solid #000;padding:3px;height:9.5mm;line-height:1.3}
.p2 .cg .t{font-size:24px;letter-spacing:8px;height:22mm;font-family:"Batang","바탕",serif}
.p2 .cg .h{height:11mm}.p2 .cg .big{font-size:16px;letter-spacing:12px;height:15mm}
@media print{.p2{page-break-before:always}}
#sw .ad{margin-bottom:14px;border-color:var(--blue)}
#sw .adt{width:100%;border-collapse:collapse;font-size:13px}
#sw .adt th,#sw .adt td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
#sw .adt td small{color:var(--mute);margin-left:4px}
#sw .adt select{width:100%}
#sw .adt tr.ok td{background:var(--okl)}
#sw .adt tr.no td{background:#fff1f1}
#sw .adt tr.sk td{background:#f0f0f0;color:#666}
#sw .sum{margin:8px 0;font-size:13px}
#sw .tt td.ok,#sw .all td.ok{background:var(--okl)}
#sdoc2{display:none}main.wide #sdoc2{display:inline-block}
#scp,#sdl{display:none}main.wide #scp,main.wide #sdl{display:inline-block}
</style></head>
<body>
<header><h1>자동기안앱</h1>
<div class="tabs" id="tabs"></div></header>
<main id="main">
<section class="panel" id="form"></section>
<section>
<div class="bar">
<button class="p" onclick="cp('all')">전체 복사</button>
<button onclick="cp('title')">제목만 복사</button>
<button onclick="cp('body')">본문만 복사</button>
<button id="scp" class="p" onclick="swCopyAtt()">수업교체원 복사</button>
<button id="sdl" onclick="swDlAtt()">수업교체원 다운로드(.hwpx)</button>
<button onclick="resetEdits()">직접 수정 되돌리기</button>
<button class="d" onclick="resetTab()">현재 탭 초기화</button>
<button class="d" onclick="resetAll()">전체 초기화</button>
<button onclick="window.print()">인쇄</button>
<button id="sdoc" onclick="swDoc()" style="display:none">수업교체원 .hwpx 저장</button>
<button id="sdoc2" onclick="swDocAtt()">붙임(수업교체원)만 .hwpx 저장</button>
</div>
<div class="paper" id="paper"></div>
<div class="paper p2" id="paper2" style="display:none;margin-top:16px"></div>
<div class="note">문서의 모든 글자는 클릭해서 바로 고칠 수 있습니다(파란 줄 표시 = 직접 수정한 줄). 노란 칸은 아직 채우지 않은 자리표시자입니다.</div>
</section>
</main>
<div id="toast"></div>
<script>
const TYPES={
 goods:{name:'물품 기안',head:'물품 기안',suf:/\s*(물품\s*)?구입$/,def:'물품 구입',what:'물품',verb:'구입'},
 allow:{name:'수당 기안',head:'수당 기안',suf:/\s*수당\s*지급$/,def:'수당 지급',what:'수당',verb:'지급',rel:{lab:'관련 계획명(수당 지급 근거 계획)',hint:'예) AI 선도교사 연수 운영',tpl:p=>`${p} 계획`}},
 biz:{name:'업무추진비 기안',head:'업무추진비 기안',suf:/\s*(협의회|회의|간담회)\s*(실시|개최)?$/,def:'협의회 실시',what:'협의회',verb:'실시',rel:{lab:'관련 계획명(업무추진비 집행 근거)',hint:'예) 2026학년도 업무추진비 집행 계획',tpl:p=>p}},
 swap:{name:'수업교체도우미',head:'수업교체 기안',suf:/$^/,def:'수업교체원 제출',what:'수업교체원',verb:'제출'}
};
const FIELDS={
 goods:[['내역','내역'],['용도','용도'],['item','대표 품목명(△△)'],['cnt','외 몇 건','n']],
 allow:[['대상','지급대상'],['일시','사업일시'],['unit','수당 단가(원)','n'],['times','횟수','n'],['people','인원(명)','n']],
 biz:[['일시','일시'],['장소','장소','','인근적의처'],['협의','협의사항'],['names','참석자(쉼표로 구분)'],['pc','총 인원(비우면 참석자 수로 자동)','n'],['unit','1인당 금액(원)','n']]
};
let T='goods',PH='○',S={goods:{},allow:{},biz:{},swap:{rs:'출장'}},EDIT={goods:{},allow:{},biz:{},swap:{}},budManual=false;
const $=id=>document.getElementById(id);
const ph=n=>`\u0001${PH.repeat(n)}\u0002`;      // 자리표시자 표식
const val=k=>(S[T][k]||'').trim();
const num=s=>{const d=String(s||'').replace(/\D/g,'');return d?+d:null};
const fmt=n=>n.toLocaleString('ko-KR');
function hangul(n){if(n===0)return'영';const D='영일이삼사오육칠팔구',U=['','십','백','천'],B=['','만','억','조'];
 const g=[];let x=n;while(x>0){g.push(x%10000);x=Math.floor(x/10000)}
 let r='';g.forEach((v,i)=>{if(!v)return;let s='';for(let p=3;p>=0;p--){const d=Math.floor(v/10**p)%10;if(d)s+=D[d]+U[p]}r=s+B[i]+r});return r}
function josa(w,a,b){const c=w.trim().slice(-1).charCodeAt(0);if(c<0xAC00||c>0xD7A3)return b;return (c-0xAC00)%28?a:b}
function budget(){const n=num(S[T].bud);return n!==null?`금${fmt(n)}원(금${hangul(n)}원)`:`금${ph(1)},${ph(3)}원(금${ph(6)}원)`}
function calcAllow(){const u=num(S.allow.unit),t=num(S.allow.times),p=num(S.allow.people);if(u!==null&&t!==null&&p!==null)S.allow.bud=String(u*t*p)}
function calcBiz(){const u=num(S.biz.unit),h=headcount();if(u!==null&&h!==null)S.biz.bud=String(u*h)}
function ref(){const o=val('org'),d=val('doc'),dt=val('date'); let date=`202${ph(1)}. ${ph(2)}. ${ph(2)}.`;
 if(dt){const [y,m,dd]=dt.split('-');date=`${y}. ${+m}. ${+dd}.`}
 return `${o||ph(3)+'학교'}-${d||ph(3)}(${date})`}
function subj(){const t=val('title');if(!t)return ph(3);const s=t.replace(TYPES[T].suf,'').trim();return s||ph(3)}
function bizKind(){const m=val('title').match(/(협의회|회의|간담회)\s*(실시|개최)?$/);return{k:m?m[1]:'협의회',v:m&&m[2]?m[2]:'실시'}}
function headcount(){const p=num(S.biz.pc);if(p)return p;const nm=val('names');return nm?nm.split(/[,，、]/).filter(x=>x.trim()).length:null}
function lines(){if(T==='swap')return swLines();const t=TYPES[T],L=[];const add=(id,lv,x)=>L.push({id,lv,x});
 const title=val('title')||(ph(3)+' '+t.def);
 add('t',0,'제목 '+title);
 {const R=t.rel,pl=val('plan');add('r',0,'1. 관련: '+ref()+(R?' '+R.tpl(pl||ph(3)):''))}
 if(T==='biz'){const b=bizKind();add('s',0,`2. ${subj()} 관련 ${b.k}${josa(b.k,'을','를')} 아래와 같이 ${b.v}하고자 합니다.`)}
 else add('s',0,`2. ${subj()} 관련 ${t.what}${josa(t.what,'을','를')} 아래와 같이 ${t.verb}하고자 합니다.`);
 const v=k=>val(k);
 if(T==='goods'){
  add('a',1,'가. 내역:'+(v('내역')?' '+v('내역'):''));add('b',1,'나. 용도:'+(v('용도')?' '+v('용도'):''));
  add('c',1,'다. 소요예산: '+budget());
  const c=num(S.goods.cnt);add('d',1,`라. 산출내역: ${v('item')||ph(2)}외 ${c||ph(1)}건(품의명세서 참조)`)}
 if(T==='allow'){
  add('a',1,'가. 지급대상:'+(v('대상')?' '+v('대상'):''));add('b',1,'나. 사업일시:'+(v('일시')?' '+v('일시'):''));
  add('c',1,'다. 소요예산: '+budget());
   const au=num(S.allow.unit),at=num(S.allow.times),ap=num(S.allow.people);
   add('d',1,`라. 산출내역: ${au!==null?fmt(au):'00,000'}원 * ${at!==null?fmt(at):'00'}회 * ${ap!==null?fmt(ap):'00'}명`);
  add('n',0,'※ 사업완료에 따른 지급조서 별첨')}
 if(T==='biz'){
  const hc=headcount(),u=num(S.biz.unit),nm=v('names');
  add('a',1,'가. 일시:'+(v('일시')?' '+v('일시'):''));add('b',1,'나. 장소: '+(v('장소')||'인근적의처'));
  add('c',1,'다. 협의사항:'+(v('협의')?' '+v('협의'):''));
  add('d',1,`라. 참석자: ${nm||ph(3)+', '+ph(3)} 총 ${hc||ph(2)}명`);
  add('e',1,'마. 소요예산: '+budget());
  add('f',1,`바. 산출내역: ${u!==null?fmt(u):'00,000'}원 * ${hc!==null?fmt(hc):'00'}명`)}
 add('x',9,'');
 add('z',0,'붙임  지출(지급)품의서 1부.  끝.');
 return L}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const mark=s=>esc(s).replace(/\u0001/g,'<span class="ph">').replace(/\u0002/g,'</span>');
function hi(s){ // 직접 수정한 줄: 현재 자리표시자 기호 강조
 const e=[...new Set(['○','□','△','◇','＿',PH])].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
 return esc(s).replace(new RegExp('(?:'+e.join('|')+')+','g'),m=>`<span class="ph">${m}</span>`)}
function render0(){
 if(T==='allow')calcAllow();if(T==='biz')calcBiz();
 const L=lines(),ed=EDIT[T];
 $('paper').innerHTML=`<h3>${TYPES[T].head}</h3>`+L.map(l=>{
  const pad=l.lv===1?'padding-left:2em;':'',cls=ed[l.id]!==undefined?' edited':'';
  const isE=ed[l.id]!==undefined;
  return `<div class="ln${cls}" contenteditable="true" spellcheck="false" data-id="${l.id}" data-lv="${l.lv}" style="${pad}">${isE?hi(ed[l.id]):mark(l.x)}</div>`}).join('')}
$('paper').addEventListener('input',e=>{const d=e.target.closest('.ln');if(!d)return;EDIT[T][d.dataset.id]=d.textContent;d.classList.add('edited')});
$('paper').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault()}});
$('paper').addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text')||'').replace(/\n/g,' '))});
function plain(){return [...document.querySelectorAll('#paper .ln')].map(d=>({lv:+d.dataset.lv,t:d.textContent.replace(/\u00a0/g,' ')}))}
function cp(w){const P=plain();let out;
 const sk=T==='swap'?2:1;const body=P.slice(sk).map(p=>(p.lv===1?'  ':'')+p.t).join('\n').replace(/\s+$/,'');
 if(w==='title')out=P[0].t.replace(/^제목\s*/,'');
 else if(w==='body')out=body;else out=P[0].t+'\n'+(sk===2?P[1].t+'\n':'')+body;
 (navigator.clipboard?navigator.clipboard.writeText(out):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=out;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}).finally(()=>toast('복사했습니다'))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}
function resetEdits(){EDIT[T]={};render();toast('직접 수정을 되돌렸습니다')}
function resetTab(){if(!confirm(TYPES[T].name+'의 입력값과 직접 수정 내용을 모두 지울까요?'))return;
 S[T]=T==='swap'?{rs:'출장'}:{};if(T==='swap')swReset();EDIT[T]={};form();render();toast('현재 탭을 초기화했습니다')}
function resetAll(){if(!confirm('모든 탭(물품·수당·업무추진비·수업교체)의 입력값과 수정 내용을 지울까요?'))return;
 S={goods:{},allow:{},biz:{},swap:{rs:'출장'}};EDIT={goods:{},allow:{},biz:{},swap:{}};swReset();PH='○';form();render();toast('전체를 초기화했습니다')}
function setPH(c){const old=PH;if(!c||c===old)return;
 Object.values(EDIT).forEach(o=>Object.keys(o).forEach(k=>{o[k]=o[k].split(old).join(c)}));PH=c;form();render()}
function inp(k,lab,kind,dflt){return `<label>${lab}</label><input data-k="${k}" ${kind==='n'?'inputmode="numeric"':''} placeholder="${dflt||''}" value="${esc(S[T][k]||'')}">`}
function form(){if(T==='swap')return swForm();const f=FIELDS[T];
 let h=`<label>제목 (입력하면 아래 내용이 기안문 형태로 만들어집니다)</label><input class="title-in" data-k="title" placeholder="예) AI 선도교사 연수 ${TYPES[T].def}" value="${esc(S[T].title||'')}">

 add('x',9,'');

 return L}
function swPaper(){const p=$('paper2');p.style.display=T==='swap'?'':'none';if(T!=='swap')return;
 const P=SW.picks,rs=esc(val('rs')),tm=esc(val('tm')),vc=esc(val('vc')),ap=P.length?TC[P[0].ti].n:'';

 p.innerHTML='<table class="cg"><colgroup><col width="13%"><col width="9%"><col width="8%"><col width="12%"><col width="6%"><col width="13%"><col width="9%"><col width="8%"><col width="12%"><col width="10%"></colgroup>'

 +'<tr><td colspan="4" class="big">원 과 목</td><td></td><td colspan="5" class="big">교 체 과 목</td></tr>'
 +'<tr><td>월,일(요일)</td><td>학년-반</td><td>교시</td><td>과목</td><td></td><td>월,일(요일)</td><td>학년-반</td><td>교시</td><td>과목</td><td>교사명</td></tr>'
 +body+'<tr><td colspan="5"><b>※ 담임교사 부재시 부담임 확인란</b></td><td colspan="5"><b>부담임 교사 : '+(vc||'&nbsp;'.repeat(12))+' &nbsp;&nbsp;&nbsp;(인)</b></td></tr></table>'}

/* ===== 하루 종일 출장(전 교시 교체) ===== */
function swSync(){if(SW.view===1)swView();swCand();swPicks();swAdList();render()}
function swEnsure(ti){if(SW.picks.length&&SW.picks[0].ti!==ti){if(!confirm('다른 교사의 교체입니다. 선택 목록을 비우고 새로 시작할까요?'))return false;SW.picks=[]}return true}
function swCandsD(i,k){const d=swDay(k);return swCands(i,k).filter(c=>!(c.w===0&&swDay(c.k2)===d))}
function swAdInfo(i,d){const t=TC[i],o=[];
 for(let p=1;p<=7;p++){const k=d+''+p,c=t.s[k];
  if(!c){if(p<=NP[d])o.push({k,p,st:'free'});continue}
  if(c[0]==='─▷'){o.push({k,p,st:'bl2'});continue}
  if(!c[1]){o.push({k,p,st:'act',nm:c[0]});continue}
  if(swIsB(t,k)){o.push({k,p,st:'bl1',nm:c[0],cl:c[1]});continue}
  o.push({k,p,st:'cls',nm:c[0],cl:c[1]})}
 return o}
function swAdHead(){const el=$('swday');if(!el)return;
 el.innerHTML=DW.map((n,x)=>{const dd=swDate(x+'0');return'<option value=\"'+x+'\"'+(x===SW.day?' selected':'')+'>'+n+'요일 ('+(dd.getMonth()+1)+'/'+dd.getDate()+')</option>'}).join('')}
function swAdList(){const el=$('swadl');if(!el)return;
 const ti=SW.ti,d=SW.day,t=TC[ti],info=swAdInfo(ti,d),mine=SW.picks.filter(q=>q.ti===ti);
 let need=0,done=0,noc=0,sk=0;
 let h='<table class=\"adt\"><thead><tr><th style=\"width:60px\">교시</th><th style=\"width:30%\">수업</th><th>교체해 줄 수업 (교사 · 시간 · 과목)</th></tr></thead><tbody>';
 info.forEach(x=>{
  if(x.st==='cls'){need++;const cur=mine.find(q=>q.k1===x.k),l=swCandsD(ti,x.k),oth=mine.filter(q=>q.k1!==x.k);
   if(cur)done++;else if(!l.length)noc++;
   const opts='<option value=\"\">'+(l.length?'— 선택 안 함 —':'교체 가능한 수업 없음')+'</option>'+l.map(c=>{const p=TC[c.pi],bad=oth.some(o=>o.k2===c.k2&&o.w2===c.w);
    return'<option value=\"'+c.pi+'|'+c.k2+'|'+c.w+'\"'+(cur&&cur.pi===c.pi&&cur.k2===c.k2&&cur.w2===c.w?' selected':'')+(bad?' disabled':'')+'>'+p.n+' · '+swMd(c.k2,c.w)+' '+swPer(c.k2)+'교시 · '+p.s[c.k2][0]+(bad?' (시간 중복)':'')+'</option>'}).join('');
   h+='<tr class=\"'+(cur?'ok':(l.length?'':'no'))+'\"><td>'+x.p+'교시</td><td>'+x.nm+'<small>'+x.cl+'</small></td><td><select data-adk=\"'+x.k+'\">'+opts+'</select></td></tr>'}
  else if(x.st==='bl1'){sk++;h+='<tr class=\"sk\"><td>'+x.p+'교시</td><td>'+x.nm+'<small>'+x.cl+'</small></td><td>연강 수업 — 자동 교체 제외(직접 협의 필요)</td></tr>'}
  else if(x.st==='bl2'){h+='<tr class=\"sk\"><td>'+x.p+'교시</td><td colspan=\"2\">└ 연강 (앞 교시와 한 묶음)</td></tr>'}
  else if(x.st==='act'){h+='<tr class=\"sk\"><td>'+x.p+'교시</td><td colspan=\"2\">'+x.nm+' — 학급 수업이 아니라 교체 대상 아님</td></tr>'}
  else{h+='<tr class=\"sk\"><td>'+x.p+'교시</td><td colspan=\"2\">공강</td></tr>'}});
 h+='</tbody></table>';
 let sum='<p class=\"sum\"><b>'+t.n+'</b> · '+swMd(d+'0')+' 종일 부재 — 교체가 필요한 수업 '+need+'교시 중 <b>'+done+'교시</b> 선택됨';
 if(!need)sum+=' (이 날은 학급 수업이 없습니다)';
 else if(done<need)sum+=noc?' · 후보가 없는 교시 '+noc+'개는 보강·수업변경을 별도로 협의해야 합니다':' · 남은 교시는 직접 고르거나 [전 교시 자동 배정]을 눌러 주세요';
 if(sk)sum+=' · 연강 '+sk+'건은 자동 교체에서 제외됩니다';
 el.innerHTML=sum+'</p>'+h}
function swAuto(){const ti=SW.ti,d=SW.day;if(!swEnsure(ti))return;
 const info=swAdInfo(ti,d).filter(x=>x.st==='cls');
 if(!info.length){toast('이 날은 교체할 학급 수업이 없습니다');return}
 if(SW.picks.some(q=>q.ti===ti&&swDay(q.k1)===d)&&!confirm('이 날의 기존 선택을 자동 배정 결과로 바꿀까요?'))return;
 const fixed=SW.picks.filter(q=>swDay(q.k1)!==d),base=new Set(fixed.map(q=>q.k2+'@'+q.w2));
 const items=info.map(x=>({k:x.k,c:swCandsD(ti,x.k).sort((a,b)=>Math.abs(a.df)-Math.abs(b.df)||(7*a.w+swDay(a.k2))-(7*b.w+swDay(b.k2))||a.k2.localeCompare(b.k2,'en',{numeric:true}))})).sort((a,b)=>a.c.length-b.c.length);
 let best={n:-1,sc:0,a:[]},nodes=0;const used=new Set(base),cur=[];
 (function dfs(ix,sc){if(nodes++>800000)return;
  if(ix===items.length){if(cur.length>best.n||(cur.length===best.n&&sc<best.sc))best={n:cur.length,sc,a:cur.slice()};return}
  const ub=cur.length+items.length-ix;if(ub<best.n||(ub===best.n&&sc>=best.sc&&best.n>=0))return;
  const it=items[ix];
  for(const c of it.c){const uk=c.k2+'@'+c.w;if(used.has(uk))continue;used.add(uk);cur.push({k:it.k,pi:c.pi,k2:c.k2,w:c.w});dfs(ix+1,sc+Math.abs(c.df));cur.pop();used.delete(uk)}
  dfs(ix+1,sc)})(0,0);
 let add=best.a.map(r=>({ti,k1:r.k,pi:r.pi,k2:r.k2,w2:r.w,s1:swFull(TC[ti].s[r.k][0]),s2:swFull(TC[r.pi].s[r.k2][0])}));
 let all=fixed.concat(add);if(all.length>10){alert('수업교체원은 최대 10건까지 작성할 수 있어 초과분은 제외했습니다.');all=all.slice(0,10)}
 SW.picks=all.sort((a,b)=>a.k1.localeCompare(b.k1,'en',{numeric:true}));
 if(!S.swap.tm){S.swap.tm='종일';const b=document.querySelector('#form [data-k=tm]');if(b)b.value='종일'}
 swSync();toast(best.n+'/'+info.length+'교시 배정했습니다')}
function swClr(){SW.picks=SW.picks.filter(q=>!(q.ti===SW.ti&&swDay(q.k1)===SW.day));swSync();toast('이 날의 선택을 해제했습니다')}
function swAdSet(k,v){const ti=SW.ti;if(!swEnsure(ti)){swAdList();return}
 SW.picks=SW.picks.filter(q=>q.k1!==k);
 if(v){const a=v.split('|'),pi=+a[0],k2=a[1],w2=+a[2]||0;
  if(SW.picks.some(o=>o.k2===k2&&o.w2===w2))alert('이미 다른 교시에서 사용 중인 시간입니다.');
  else if(SW.picks.length>=10)alert('수업교체원은 최대 10건까지 작성할 수 있습니다.');
  else SW.picks.push({ti,k1:k,pi,k2,w2,s1:swFull(TC[ti].s[k][0]),s2:swFull(TC[pi].s[k2][0])})}
 SW.picks.sort((a,b)=>a.k1.localeCompare(b.k1,'en',{numeric:true}));swSync()}
function render(){render0();swPaper()}

 if(e.target.id==='swauto'){swAuto();return}

 if(e.target.dataset.adk!==undefined){swAdSet(e.target.dataset.adk,e.target.value)}
 if(e.target.id==='swdt'){if(!e.target.value)return;const d=new Date(e.target.value+'T00:00'),x=d.getDay();d.setDate(d.getDate()+(x===0?-6:1-x));SW.mon=d;swWk();swView();swCand();swPicks();swAdHead();swAdList();render()}});

function swAttInline(){const src=$('paper2').querySelector('table');if(!src)return'';
 const c=src.cloneNode(true);
 const walk=(a,b)=>{const cs=getComputedStyle(a),tg=a.tagName;let st='';
  if(tg==='TABLE'){b.setAttribute('border','1');b.setAttribute('cellspacing','0');b.setAttribute('cellpadding','3');
   st='border-collapse:collapse;width:100%;table-layout:fixed;text-align:center;font-family:\'Malgun Gothic\',sans-serif;font-size:'+cs.fontSize+';'}
  else if(tg==='TD'||tg==='TH'){
   st='border:1px solid #000;padding:3px;text-align:center;vertical-align:middle;height:'+cs.height+';font-size:'+cs.fontSize+';font-family:'+cs.fontFamily+';font-weight:'+cs.fontWeight+';letter-spacing:'+cs.letterSpacing+';line-height:1.3;'}
  if(st)b.setAttribute('style',st);
  for(let i=0;i<a.children.length;i++)walk(a.children[i],b.children[i])};
 walk(src,c);return c.outerHTML}
function swAttText(){return[...$('paper2').querySelectorAll('tr')].map(r=>[...r.cells].map(x=>x.textContent.replace(/\u00a0/g,' ').trim()).join('\t')).join('\n')}
async function swCopyAtt(){
 const tb=swAttInline(),html='<html><body>'+tb+'</body></html>',text=swAttText();
 try{if(navigator.clipboard&&window.ClipboardItem){
  await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
  toast('수업교체원 전체 양식을 복사했습니다');return}}catch(e){}
 const tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-9999px;top:0;background:#fff';tmp.innerHTML=tb;document.body.appendChild(tmp);
 const r=document.createRange();r.selectNodeContents(tmp);const s=getSelection();s.removeAllRanges();s.addRange(r);
 let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 s.removeAllRanges();tmp.remove();toast(ok?'수업교체원 전체 양식을 복사했습니다':'복사에 실패했습니다. 브라우저 권한을 확인해 주세요')}
